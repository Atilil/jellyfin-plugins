# Run before each commit (global git hook) and in CI.
# Local hooks use the tools from the flake dev shell, so versions match the laptop.

default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks-system
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 33b50eb042bee26eac0ee96ad84aa9c1b4dccdd8 # frozen: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          [
            --verbose,
            feat,
            fix,
            refactor,
            docs,
            ci,
            build,
            chore,
            test,
            perf,
            revert,
          ]

  - repo: local
    hooks:
      - id: actionlint
        name: Lint GitHub workflows
        entry: actionlint
        language: system
        files: ^\.github/workflows/[^/]+\.ya?ml$

      - id: markdownlint
        name: Lint Markdown
        entry: markdownlint-cli2
        language: system
        types: [markdown]

      - id: ruff-check
        name: Lint Python
        entry: ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: Check Python formatting
        entry: ruff format --check
        language: system
        types: [python]
